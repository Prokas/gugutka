name: Draw Keymap
on:
  push:
    paths:
      - 'config/boards/shields/googootkah/*.keymap'
      - 'config/boards/shields/googootkah/info.json'
      - '.github/workflows/draw.yml'
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install keymap-drawer

      - run: |
          keymap parse -z config/boards/shields/googootkah/googootkah.keymap \
            --base-keymaps config/boards/shields/googootkah/info.json \
            > keymap.yaml

      - run: keymap draw keymap.yaml > keymap.svg

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update keymap SVG'
